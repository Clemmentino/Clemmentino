<svg width="1280" height="260" viewBox="0 0 1280 260" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1280" y2="260" gradientUnits="userSpaceOnUse">
      <stop stop-color="#fbfcf8"/>
      <stop offset="1" stop-color="#edf3f5"/>
    </linearGradient>
    <style>
      .sans { font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
      .serif { font-family: Georgia, "Times New Roman", serif; }
      .step { font-size: 18px; letter-spacing: 3px; font-weight: 800; }
      .title { font-size: 28px; font-weight: 800; }
      .copy { font-size: 18px; }
      .path { stroke-dasharray: 14 16; animation: dash 12s linear infinite; }
      .dot { animation: pulse 2.8s ease-in-out infinite; transform-origin: center; }
      @keyframes dash { to { stroke-dashoffset: -220; } }
      @keyframes pulse { 0%,100% { opacity: .6; transform: scale(.92); } 50% { opacity: 1; transform: scale(1.08); } }
    </style>
  </defs>
  <rect width="1280" height="260" rx="28" fill="url(#bg)"/>
  <text x="48" y="58" class="sans step" fill="#e16f4f">PORTFOLIO FLOW</text>
  <path class="path" d="M90 154 H1190" stroke="#14191d" stroke-opacity="0.2" stroke-width="4" fill="none"/>
  <g>
    <circle class="dot" cx="150" cy="154" r="17" fill="#e16f4f"/>
    <text x="112" y="114" class="serif title" fill="#14191d">About</text>
    <text x="78" y="196" class="sans copy" fill="#5d6970">identity and direction</text>
  </g>
  <g>
    <circle class="dot" cx="410" cy="154" r="17" fill="#e9b949"/>
    <text x="372" y="114" class="serif title" fill="#14191d">Work</text>
    <text x="326" y="196" class="sans copy" fill="#5d6970">selected systems</text>
  </g>
  <g>
    <circle class="dot" cx="670" cy="154" r="17" fill="#75a7d9"/>
    <text x="620" y="114" class="serif title" fill="#14191d">Process</text>
    <text x="590" y="196" class="sans copy" fill="#5d6970">clarity before polish</text>
  </g>
  <g>
    <circle class="dot" cx="930" cy="154" r="17" fill="#7aa66a"/>
    <text x="872" y="114" class="serif title" fill="#14191d">Contact</text>
    <text x="836" y="196" class="sans copy" fill="#5d6970">frontend and public tech</text>
  </g>
</svg>
