<svg width="1280" height="360" viewBox="0 0 1280 360" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="panel" x1="0" y1="0" x2="1280" y2="360" gradientUnits="userSpaceOnUse">
      <stop stop-color="#14191d"/>
      <stop offset="1" stop-color="#22323c"/>
    </linearGradient>
    <linearGradient id="warm" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#e16f4f"/>
      <stop offset="1" stop-color="#e9b949"/>
    </linearGradient>
    <linearGradient id="cool" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#75a7d9"/>
      <stop offset="1" stop-color="#7aa66a"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="14" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <style>
      .sans { font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
      .serif { font-family: Georgia, "Times New Roman", serif; }
      .tiny { font-size: 16px; letter-spacing: 4px; font-weight: 800; }
      .title { font-size: 54px; font-weight: 700; letter-spacing: -1.5px; }
      .body { font-size: 22px; }
      .label { font-size: 17px; letter-spacing: 3px; font-weight: 800; }
      .card { animation: rise 5s ease-in-out infinite; }
      .card2 { animation: rise 6.5s ease-in-out infinite reverse; }
      .line { stroke-dasharray: 16 18; animation: move 18s linear infinite; }
      @keyframes rise { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-10px); } }
      @keyframes move { to { stroke-dashoffset: -260; } }
    </style>
  </defs>
  <rect width="1280" height="360" rx="30" fill="url(#panel)"/>
  <circle cx="1120" cy="80" r="120" fill="#75a7d9" fill-opacity="0.14" filter="url(#glow)"/>
  <circle cx="120" cy="310" r="120" fill="#e16f4f" fill-opacity="0.14" filter="url(#glow)"/>
  <path class="line" d="M50 285 C210 220 300 320 454 240 C612 158 712 270 882 160 C1010 78 1106 116 1230 86" stroke="#fbfcf8" stroke-opacity="0.18" stroke-width="3" fill="none"/>

  <text x="58" y="68" class="sans tiny" fill="#e9b949">IDENTITY CARD</text>
  <text x="58" y="134" class="serif title" fill="#fbfcf8">Clemm Amoguis</text>
  <text x="58" y="182" class="sans body" fill="#b9c6cc">aka Clemmentino / BSIT 2nd year / Davao Del Norte State College</text>
  <text x="58" y="224" class="sans body" fill="#b9c6cc">Frontend-focused, practical with backend, interested in public-tech systems.</text>

  <g class="card">
    <rect x="750" y="68" width="196" height="94" rx="22" fill="#fbfcf8"/>
    <text x="780" y="110" class="sans label" fill="#14191d">FRONTEND</text>
    <text x="780" y="140" class="sans" font-size="18" fill="#5d6970">UI / UX / layout</text>
  </g>
  <g class="card2">
    <rect x="980" y="68" width="196" height="94" rx="22" fill="#e9b949"/>
    <text x="1010" y="110" class="sans label" fill="#101417">BACKEND</text>
    <text x="1010" y="140" class="sans" font-size="18" fill="#101417" opacity="0.72">PHP / Laravel</text>
  </g>
  <g class="card2">
    <rect x="750" y="200" width="196" height="94" rx="22" fill="#75a7d9"/>
    <text x="780" y="242" class="sans label" fill="#101417">DEPLOY</text>
    <text x="780" y="272" class="sans" font-size="18" fill="#101417" opacity="0.72">Vercel / Render</text>
  </g>
  <g class="card">
    <rect x="980" y="200" width="196" height="94" rx="22" fill="url(#warm)"/>
    <text x="1010" y="242" class="sans label" fill="#fffaf1">PUBLIC TECH</text>
    <text x="1010" y="272" class="sans" font-size="18" fill="#fffaf1" opacity="0.82">warning systems</text>
  </g>
</svg>
