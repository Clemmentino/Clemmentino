    <style>
      .sans { font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
      .serif { font-family: Georgia, "Times New Roman", serif; }
      .label { font-size: 16px; letter-spacing: 4px; font-weight: 800; }
      .title { font-size: 46px; font-weight: 700; letter-spacing: -1px; }
      .copy { font-size: 20px; }
      .snake { stroke-dasharray: 80 640; animation: snake 5.5s linear infinite; }
      .glow { animation: glow 2.8s ease-in-out infinite; }
      @keyframes snake { to { stroke-dashoffset: -720; } }
      @keyframes glow { 0%,100% { opacity: .46; } 50% { opacity: 1; } }
