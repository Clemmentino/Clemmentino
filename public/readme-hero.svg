<svg width="1280" height="560" viewBox="0 0 1280 560" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1280" y2="560" gradientUnits="userSpaceOnUse">
      <stop stop-color="#fbfcf8"/>
      <stop offset="0.5" stop-color="#edf3f5"/>
      <stop offset="1" stop-color="#f9faf4"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="22" stdDeviation="22" flood-color="#1f2f39" flood-opacity="0.18"/>
    </filter>
    <filter id="blur" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="28"/>
    </filter>
    <style>
      .sans { font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
      .serif { font-family: Georgia, "Times New Roman", serif; }
      .eyebrow { font-size: 16px; letter-spacing: 4px; font-weight: 800; }
      .title { font-size: 68px; font-weight: 700; letter-spacing: -2px; }
      .copy { font-size: 22px; }
      .chip { font-size: 16px; letter-spacing: 2px; font-weight: 800; }
      .float { animation: float 6s ease-in-out infinite; }
      .float2 { animation: float2 7s ease-in-out infinite; }
      .dash { stroke-dasharray: 10 18; animation: dash 18s linear infinite; }
      @keyframes float { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-12px); } }
      @keyframes float2 { 0%,100% { transform: translateY(0); } 50% { transform: translateY(10px); } }
      @keyframes dash { to { stroke-dashoffset: -260; } }
    </style>
  </defs>

  <rect width="1280" height="560" rx="34" fill="url(#bg)"/>
  <circle cx="148" cy="96" r="150" fill="#e16f4f" fill-opacity="0.12" filter="url(#blur)"/>
  <circle cx="1060" cy="110" r="180" fill="#75a7d9" fill-opacity="0.22" filter="url(#blur)"/>
  <circle cx="1060" cy="468" r="140" fill="#7aa66a" fill-opacity="0.14" filter="url(#blur)"/>
  <path class="dash" d="M72 460 C225 390 312 490 470 402 C632 312 740 395 904 278 C1000 210 1115 218 1208 196" stroke="#14191d" stroke-opacity="0.16" stroke-width="2.5" fill="none"/>

  <g transform="translate(76 76)">
    <circle cx="11" cy="11" r="7" fill="#e16f4f"/>
    <text x="31" y="17" class="sans eyebrow" fill="#5d6970">CLEMM AMOGUIS / CLEMMENTINO</text>
  </g>

  <g transform="translate(76 152)">
    <text x="0" y="0" class="serif title" fill="#14191d">Clear interfaces</text>
    <text x="0" y="78" class="serif title" fill="#14191d">for useful systems.</text>
    <text x="0" y="142" class="sans copy" fill="#5d6970">Frontend-focused BSIT student building UI/UX,</text>
    <text x="0" y="176" class="sans copy" fill="#5d6970">Laravel/PHP flows, deployment, and public-tech ideas.</text>
  </g>

  <g transform="translate(76 392)">
    <rect width="144" height="42" rx="21" fill="#e16f4f"/>
    <text x="24" y="27" class="sans chip" fill="#fffaf1">UI / UX</text>
    <rect x="162" width="152" height="42" rx="21" fill="#14191d"/>
    <text x="188" y="27" class="sans chip" fill="#fbfcf8">LARAVEL</text>
    <rect x="332" width="142" height="42" rx="21" fill="#e9b949"/>
    <text x="358" y="27" class="sans chip" fill="#101417">DEPLOY</text>
    <rect x="492" width="190" height="42" rx="21" fill="#75a7d9"/>
    <text x="518" y="27" class="sans chip" fill="#101417">PUBLIC TECH</text>
  </g>

  <g class="float" filter="url(#shadow)">
    <rect x="780" y="128" width="380" height="276" rx="26" fill="#fbfcf8" fill-opacity="0.86" stroke="#14191d" stroke-opacity="0.1"/>
    <rect x="812" y="166" width="154" height="16" rx="8" fill="#14191d" fill-opacity="0.82"/>
    <rect x="812" y="202" width="286" height="12" rx="6" fill="#5d6970" fill-opacity="0.34"/>
    <rect x="812" y="228" width="232" height="12" rx="6" fill="#5d6970" fill-opacity="0.22"/>
    <rect x="812" y="276" width="86" height="86" rx="16" fill="#e16f4f" fill-opacity="0.15" stroke="#e16f4f" stroke-opacity="0.34"/>
    <rect x="928" y="276" width="86" height="86" rx="16" fill="#75a7d9" fill-opacity="0.17" stroke="#75a7d9" stroke-opacity="0.34"/>
    <rect x="1044" y="276" width="86" height="86" rx="16" fill="#7aa66a" fill-opacity="0.15" stroke="#7aa66a" stroke-opacity="0.34"/>
    <path d="M834 336 L858 306 L884 332" stroke="#e16f4f" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M950 336 L974 306 L1000 332" stroke="#75a7d9" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M1066 336 L1090 306 L1116 332" stroke="#7aa66a" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <g class="float2" filter="url(#shadow)">
    <rect x="704" y="84" width="190" height="58" rx="17" fill="#fbfcf8"/>
    <circle cx="734" cy="113" r="8" fill="#e16f4f"/>
    <text x="754" y="119" class="sans chip" fill="#14191d">BSIT 2ND YEAR</text>
  </g>
</svg>
