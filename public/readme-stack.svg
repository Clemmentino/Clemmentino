<svg width="1280" height="220" viewBox="0 0 1280 220" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1280" y2="220" gradientUnits="userSpaceOnUse">
      <stop stop-color="#14191d"/>
      <stop offset="1" stop-color="#263743"/>
    </linearGradient>
    <style>
      .sans { font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
      .label { font-size: 17px; letter-spacing: 3px; font-weight: 800; }
      .title { font-size: 32px; font-weight: 800; }
      .sub { font-size: 18px; }
      .pulse { animation: pulse 3s ease-in-out infinite; transform-origin: center; }
      @keyframes pulse { 0%,100% { opacity: .74; } 50% { opacity: 1; } }
    </style>
  </defs>
  <rect width="1280" height="220" rx="28" fill="url(#bg)"/>
  <text x="52" y="58" class="sans label" fill="#e9b949">BUILD STACK</text>
  <text x="52" y="103" class="sans title" fill="#fbfcf8">A focused Next.js portfolio with custom motion and visual rhythm.</text>
  <text x="52" y="139" class="sans sub" fill="#b9c6cc">Next.js 16 / React 19 / App Router / Custom CSS / Vercel-ready deployment</text>

  <g transform="translate(52 164)" class="pulse">
    <rect x="0" y="0" width="140" height="34" rx="17" fill="#fbfcf8"/>
    <text x="22" y="23" class="sans label" fill="#14191d">NEXT.JS</text>
    <rect x="160" y="0" width="122" height="34" rx="17" fill="#75a7d9"/>
    <text x="183" y="23" class="sans label" fill="#101417">REACT</text>
    <rect x="302" y="0" width="176" height="34" rx="17" fill="#e16f4f"/>
    <text x="324" y="23" class="sans label" fill="#fffaf1">APP ROUTER</text>
    <rect x="498" y="0" width="112" height="34" rx="17" fill="#e9b949"/>
    <text x="528" y="23" class="sans label" fill="#101417">CSS</text>
    <rect x="630" y="0" width="150" height="34" rx="17" fill="#7aa66a"/>
    <text x="654" y="23" class="sans label" fill="#101417">VERCEL</text>
    <rect x="800" y="0" width="152" height="34" rx="17" fill="#fbfcf8"/>
    <text x="824" y="23" class="sans label" fill="#14191d">LARAVEL</text>
    <rect x="972" y="0" width="194" height="34" rx="17" fill="#75a7d9"/>
    <text x="994" y="23" class="sans label" fill="#101417">PUBLIC TECH</text>
  </g>
</svg>
